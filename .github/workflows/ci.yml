name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel@sha256:a26046b7363dad8e2614858f4313949ae9b05c9c5f31de343a54864b9e20806f
    timeout-minutes: 30
    steps:
      - name: Install checkout prerequisite
        run: pacman -Syu --noconfirm --needed git

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          pacman -S --noconfirm --needed rust cargo-deny linux-headers gnupg pacman-contrib
          echo "KDIR=$(find /usr/lib/modules -mindepth 2 -maxdepth 2 -type d -name build | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: Run canonical quality checks
        run: make quality

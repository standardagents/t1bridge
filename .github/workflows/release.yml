name: Release candidate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit SHA for build-only mode, or signed version tag for CI signing
        required: true
        type: string
      ci_sign:
        description: Sign using the release environment
        required: true
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel@sha256:a26046b7363dad8e2614858f4313949ae9b05c9c5f31de343a54864b9e20806f
    timeout-minutes: 60
    env:
      RELEASE_REF: ${{ inputs.ref }}
      CI_SIGN: ${{ inputs.ci_sign }}
    outputs:
      commit_oid: ${{ steps.release-input.outputs.commit_oid }}
      tag_oid: ${{ steps.release-input.outputs.tag_oid }}
    steps:
      - name: Configure package snapshot and install checkout prerequisite
        run: |
          printf '%s\n' \
            'Server = https://archive.archlinux.org/repos/2026/08/29/$repo/os/$arch' \
            >/etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm --needed git

      - name: Check out the exact release input
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Install build dependencies
        run: |
          pacman -S --noconfirm --needed dkms linux-headers pam pkgconf rust sudo xz gnupg pacman-contrib
          install -d -m 0755 /run/systemd

      - name: Verify release input
        id: release-input
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(bash -c 'source "$1"; printf "%s" "$pkgver"' _ packaging/arch/t1bridge/PKGBUILD)
          for recipe in packaging/arch/t1bridge{,-dkms}/PKGBUILD; do
            test "$(bash -c 'source "$1"; printf "%s" "$pkgver"' _ "$recipe")" = "$version"
          done
          tag_oid=
          if test "$CI_SIGN" = true; then
            test "$RELEASE_REF" = "v$version"
            test "$(git cat-file -t "refs/tags/$RELEASE_REF")" = tag
            test "$(git rev-parse "$RELEASE_REF^{commit}")" = "$(git rev-parse HEAD)"
            tag_oid=$(git rev-parse "refs/tags/$RELEASE_REF")
          else
            [[ "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]]
            test "$RELEASE_REF" = "$(git rev-parse HEAD)"
          fi
          printf 'commit_oid=%s\ntag_oid=%s\nversion=%s\n' \
            "$(git rev-parse HEAD)" "$tag_oid" "$version" >>"$GITHUB_OUTPUT"

      - name: Create deterministic source
        id: source
        env:
          VERSION: ${{ steps.release-input.outputs.version }}
        run: |
          set -euo pipefail
          version=$VERSION
          epoch=$(git show -s --format=%ct HEAD)
          mkdir -p release
          git archive --format=tar --mtime='1970-01-01T00:00:00Z' \
            --prefix="t1bridge-$version/" HEAD^{tree} |
            gzip -n >"release/t1bridge-$version.tar.gz"
          archive_sha=$(sha256sum "release/t1bridge-$version.tar.gz" | cut -d' ' -f1)
          for recipe in packaging/arch/t1bridge{,-dkms}/PKGBUILD; do
            test "$(bash -c 'source "$1"; printf "%s" "${sha256sums[0]}"' _ "$recipe")" = "$archive_sha"
          done
          printf 'epoch=%s\nversion=%s\n' "$epoch" "$version" >>"$GITHUB_OUTPUT"
          cp packaging/arch/t1bridge/PKGBUILD release/t1bridge.PKGBUILD
          cp packaging/arch/t1bridge-dkms/PKGBUILD release/t1bridge-dkms.PKGBUILD
          cp packaging/arch/libfprint-t1bridge/PKGBUILD \
            release/libfprint-t1bridge.PKGBUILD
          cp packaging/arch/libfprint-t1bridge/*.patch release/
          cp packaging/arch/fprintd-t1bridge/PKGBUILD \
            release/fprintd-t1bridge.PKGBUILD
          cp packaging/arch/fprintd-t1bridge/*.patch release/

      - name: Build packages
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source.outputs.epoch }}
        run: |
          set -euo pipefail
          useradd --create-home builder
          printf 'builder ALL=(root) NOPASSWD: /usr/bin/pacman\n' >/etc/sudoers.d/t1bridge-builder
          chmod 0440 /etc/sudoers.d/t1bridge-builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          output="$GITHUB_WORKSPACE/build-packages"
          install -d -o builder -g builder "$output"
          for package in t1bridge-dkms t1bridge libfprint-t1bridge fprintd-t1bridge; do
            directory="$GITHUB_WORKSPACE/packaging/arch/$package"
            if test "$package" = t1bridge || test "$package" = t1bridge-dkms; then
              cp "$GITHUB_WORKSPACE/release/t1bridge-${{ steps.source.outputs.version }}.tar.gz" \
                "$directory/"
            fi
            runuser -u builder -- env \
              SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
              PKGDEST="$output" \
              makepkg --dir "$directory" \
                --cleanbuild --clean --force --noconfirm --nosign --syncdeps
            if test "$package" = libfprint-t1bridge; then
              mapfile -t built_libfprint < <(
                find "$output" -maxdepth 1 -type f \
                  -name 'libfprint-t1bridge-*.pkg.tar.zst' -print
              )
              test "${#built_libfprint[@]}" -eq 1
              pacman -U --noconfirm --ask=4 "${built_libfprint[0]}"
            fi
          done

      - name: Collect candidate packages
        run: |
          set -euo pipefail
          mapfile -t packages < <(find build-packages -maxdepth 1 -type f -name '*.pkg.tar.zst' -print | sort)
          test "${#packages[@]}" -eq 4
          cp "${packages[@]}" release/
          (cd release && sha256sum *.PKGBUILD *.patch *.pkg.tar.zst *.tar.gz | LC_ALL=C sort -k2 >SHA256SUMS.unsigned)

      - name: Verify isolated package lifecycle
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = true
          test -f /.dockerenv
          test "$(id -u)" -eq 0
          export SYSTEMD_OFFLINE=1
          # The build job already runs in a disposable Arch container.
          install -d /etc/mkinitcpio.conf.d
          printf '%s\n' \
            'HOOKS=(base systemd microcode modconf kms keyboard sd-vconsole block filesystems fsck)' \
            >/etc/mkinitcpio.conf.d/00-lifecycle-generic.conf
          mapfile -t packages < <(find build-packages -maxdepth 1 -type f -name '*.pkg.tar.zst' -print | sort)
          test "${#packages[@]}" -eq 4
          pacman \
            --noconfirm --ask=4 -S --needed libfprint fprintd dkms linux linux-headers
          pacman \
            -Q libfprint fprintd
          pacman \
            --noconfirm --ask=4 -U "${packages[@]}"
          pacman \
            -Q t1bridge t1bridge-dkms libfprint-t1bridge fprintd-t1bridge
          ! pacman \
            -Qq | grep -Fxq libfprint
          ! pacman \
            -Qq | grep -Fxq fprintd
          test -f "/usr/lib/modprobe.d/t1bridge.conf"
          assert_dkms_modules() {
            local module
            local -a matches
            for module in t1_cfgsel appletbdrm apple_t1_ncm uvcvideo; do
              mapfile -t matches < <(find "/usr/lib/modules" \
                -type f -path "*/updates/dkms/$module.ko*")
              test "${#matches[@]}" -eq 1
            done
          }
          assert_dkms_modules
          test -x "/usr/lib/fprintd"
          test -f "/usr/lib/security/pam_fprintd.so"
          test -f "/usr/lib/systemd/system/fprintd.service"
          test -f "/usr/share/dbus-1/system-services/net.reactivated.Fprint.service"
          test -f "/usr/share/dbus-1/system.d/net.reactivated.Fprint.conf"
          systemd-sysusers --root=/
          systemd-tmpfiles --root=/ --create
          t1bridge_gid=$(awk -F: '$1 == "t1bridge" { print $3 }' "/etc/group")
          [[ "$t1bridge_gid" =~ ^[0-9]+$ ]]
          test "$(stat -c '%u:%g:%a' "/run/t1bridge")" = "0:$t1bridge_gid:750"
          systemctl --root=/ preset \
            t1-touchbar-hw.service t1-touchid-auth.socket \
            t1bridge-fingerprint.socket t1bridge-import.service
          systemctl --root=/ --global preset t1-touchbar.service
          systemctl --root=/ is-enabled --quiet t1-touchbar-hw.service
          systemctl --root=/ is-enabled --quiet t1-touchid-auth.socket
          systemctl --root=/ is-enabled --quiet t1bridge-fingerprint.socket
          ! systemctl --root=/ is-enabled --quiet t1bridge-import.service
          install -m 0600 /dev/null \
            "/var/lib/t1bridge/machine-data/calibration.fscl"
          install -d "/home/synthetic/.config/t1bridge"
          install -m 0700 /usr/bin/true \
            "/home/synthetic/.config/t1bridge/renderer"
          pacman \
            --noconfirm -U "${packages[@]}"
          test -f "/var/lib/t1bridge/machine-data/calibration.fscl"
          test -x "/home/synthetic/.config/t1bridge/renderer"
          assert_dkms_modules
          systemctl --root=/ disable \
            t1-touchbar-hw.service t1-touchid-auth.socket \
            t1bridge-fingerprint.socket
          systemctl --root=/ --global disable t1-touchbar.service
          pacman \
            --noconfirm -R \
            t1bridge t1bridge-dkms libfprint-t1bridge fprintd-t1bridge
          test ! -e "/usr/bin/t1bridge"
          test ! -e "/usr/src/t1bridge-dkms-${{ steps.source.outputs.version }}"
          test ! -e "/usr/lib/modprobe.d/t1bridge.conf"
          test ! -e "/usr/lib/libfprint-2.so.2"
          test ! -e "/usr/lib/fprintd"
          test ! -e "/usr/lib/security/pam_fprintd.so"
          test ! -e "/usr/lib/systemd/system/fprintd.service"
          test ! -e "/usr/share/dbus-1/system-services/net.reactivated.Fprint.service"
          test ! -e "/usr/share/dbus-1/system.d/net.reactivated.Fprint.conf"
          test -f "/var/lib/t1bridge/machine-data/calibration.fscl"
          test -x "/home/synthetic/.config/t1bridge/renderer"

      - name: Save unsigned candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-${{ steps.release-input.outputs.commit_oid }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  sign:
    if: ${{ inputs.ci_sign }}
    needs: build
    runs-on: ubuntu-24.04
    container: archlinux:base-devel@sha256:a26046b7363dad8e2614858f4313949ae9b05c9c5f31de343a54864b9e20806f
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    env:
      SIGNING_FINGERPRINT: ${{ vars.T1BRIDGE_SIGNING_SUBKEY_FINGERPRINT }}
      SIGNING_PRIMARY_FINGERPRINT: ${{ vars.T1BRIDGE_SIGNING_PRIMARY_FINGERPRINT }}
      TAG: ${{ inputs.ref }}
    steps:
      - name: Install repository tools
        run: |
          printf '%s\n' \
            'Server = https://archive.archlinux.org/repos/2026/08/29/$repo/os/$arch' \
            >/etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm --needed git github-cli gnupg pacman-contrib

      - name: Check out the signed tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Download unsigned candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: unsigned-${{ needs.build.outputs.commit_oid }}
          path: release

      - name: Verify unsigned candidate
        run: |
          set -euo pipefail
          cd release
          test -f SHA256SUMS.unsigned
          test -f "t1bridge-${TAG#v}.tar.gz"
          test -f t1bridge.PKGBUILD
          test -f t1bridge-dkms.PKGBUILD
          test -f libfprint-t1bridge.PKGBUILD
          test -f fprintd-t1bridge.PKGBUILD
          test -f 0001-Add-T1Bridge-fingerprint-driver.patch
          test -f 0002-Use-relative-test-helper-path.patch
          test -f 0001-Honor-driver-native-duplicate-detection.patch
          test -f 0002-Fix-tests-for-current-GLib.patch
          test -z "$(find . -mindepth 1 ! -type f -print -quit)"
          test "$(find . -mindepth 1 -type f -printf x | wc -c)" -eq 14
          mapfile -t packages < <(find . -maxdepth 1 -type f \
            -name '*.pkg.tar.zst' -printf '%f\n' | sort)
          test "${#packages[@]}" -eq 4
          actual_manifest=$(sha256sum *.PKGBUILD *.patch *.pkg.tar.zst *.tar.gz | LC_ALL=C sort -k2)
          diff -u SHA256SUMS.unsigned <(printf '%s\n' "$actual_manifest")

      - name: Import replaceable signing subkey
        env:
          SIGNING_SUBKEY: ${{ secrets.T1BRIDGE_SIGNING_SUBKEY }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_FINGERPRINT"
          test -n "$SIGNING_PRIMARY_FINGERPRINT"
          test -n "$SIGNING_SUBKEY"
          export GNUPGHOME="$RUNNER_TEMP/t1bridge-gnupg"
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$SIGNING_SUBKEY" | gpg --batch --import
          listing=$(LC_ALL=C gpg --list-secret-keys "$SIGNING_FINGERPRINT")
          printf '%s\n' "$listing" | grep -q '^sec#'
          test "$(printf '%s\n' "$listing" | grep -c '^ssb')" -eq 1
          colon_listing=$(gpg --batch --with-colons \
            --list-secret-keys "$SIGNING_FINGERPRINT")
          printf '%s\n' "$colon_listing" |
            awk -F: '$1 == "ssb" { count++; if ($12 !~ /s/) bad=1 }
              END { exit !(count == 1 && !bad) }'
          actual=$(printf '%s\n' "$colon_listing" |
            awk -F: '$1 == "ssb" { want=1; next } want && $1 == "fpr" { print $10; exit }')
          test "$actual" = "$SIGNING_FINGERPRINT"
          actual_primary=$(gpg --batch --with-colons --list-keys "$SIGNING_FINGERPRINT" |
            awk -F: '$1 == "pub" { want=1; next } want && $1 == "fpr" { print $10; exit }')
          test "$actual_primary" = "$SIGNING_PRIMARY_FINGERPRINT"
          printf 'GNUPGHOME=%s\n' "$GNUPGHOME" >>"$GITHUB_ENV"

      - name: Verify exact signed tag
        env:
          EXPECTED_COMMIT_OID: ${{ needs.build.outputs.commit_oid }}
          EXPECTED_TAG_OID: ${{ needs.build.outputs.tag_oid }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse "refs/tags/$TAG")" = "$EXPECTED_TAG_OID"
          test "$(git rev-parse "$TAG^{commit}")" = "$EXPECTED_COMMIT_OID"
          tag_status=$(git verify-tag --raw "$TAG" 2>&1)
          printf '%s\n' "$tag_status" |
            awk -v expected="$SIGNING_PRIMARY_FINGERPRINT" '
              $1 == "[GNUPG:]" && $2 == "VALIDSIG" {
                count++; if ($NF != expected) bad=1
              }
              END { exit !(count == 1 && !bad) }'

      - name: Sign packages and repository
        env:
          SIGNING_PASSPHRASE: ${{ secrets.T1BRIDGE_SIGNING_SUBKEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_PASSPHRASE"
          cd release
          sign() {
            printf '%s' "$SIGNING_PASSPHRASE" |
              gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --local-user "$SIGNING_FINGERPRINT!" \
              --detach-sign "$1"
            gpg --batch --verify "$1.sig" "$1"
          }
          for package in *.pkg.tar.zst; do sign "$package"; done
          repo-add --include-sigs standardagents.db.tar.zst ./*.pkg.tar.zst
          cp --dereference standardagents.db standardagents.db.asset
          cp --dereference standardagents.files standardagents.files.asset
          unlink standardagents.db
          unlink standardagents.files
          mv standardagents.db.asset standardagents.db
          mv standardagents.files.asset standardagents.files
          sign standardagents.db
          sign standardagents.files
          gpg --batch --armor --export "$SIGNING_FINGERPRINT" >t1bridge-signing-key.asc
          sha256sum *.PKGBUILD *.patch *.asc *.db *.db.tar.zst *.files \
            *.files.tar.zst *.pkg.tar.zst *.sig *.tar.gz \
            SHA256SUMS.unsigned |
            LC_ALL=C sort -k2 >SHA256SUMS

      - name: Clear signing material
        if: always()
        run: |
          set -euo pipefail
          cleanup_home="$RUNNER_TEMP/t1bridge-gnupg"
          test -n "$RUNNER_TEMP"
          GNUPGHOME="$cleanup_home" gpgconf --kill all || true
          rm -rf -- "$cleanup_home"

      - name: Create signed draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "T1Bridge ${TAG#v}" \
            --notes "Signed release candidate. Review the assets before publishing."

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
]

# The maintainer publisher's derive parser uses Unicode identifier tables.
[[licenses.exceptions]]
name = "unicode-ident"
allow = ["MIT", "Unicode-3.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

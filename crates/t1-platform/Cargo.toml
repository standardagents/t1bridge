[package]
name = "t1-platform"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[features]
default = []
frame-memfd = []
import-fs = []
preserved-efi = []
preserved-efi-discovery = ["preserved-efi"]
secret-wipe = []
sep-operation = []
seqpacket = []
seqpacket-test-support = ["seqpacket"]
system-brightness = []
touchbar-drm = []
touchbar-io = []
touchbar-session = []
usb-cycle-guard = []
xz = []
online-recovery = []

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
